[package]
name = "notepad_win32"
version = "0.1.0"
edition = "2021"

[dependencies]
walkdir = "2"
notify = "6"
rfd = "0.15"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
plist = "1"
once_cell = "1"

# Cross-platform windowing and rendering
winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
skia-safe = { version = "0.72", features = ["gl", "textlayout"] }
gl = "0.14.0"
raw-window-handle = "0.5"

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.ropey]
opt-level = 3
